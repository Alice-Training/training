<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGS Prüfungs-Kern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Lexend+Deca:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF6EF;
    --bg-card:#FFFFFF;
    --ink:#2C332F;
    --ink-soft:#5B655F;
    --line:#E4DFD3;
    --teal:#3F7168;
    --teal-dark:#2C534C;
    --teal-tint:#E4EEEB;
    --a:#B5544B;
    --a-tint:#F4E4E1;
    --b:#B8862E;
    --b-tint:#F6ECD8;
    --c:#5C8A6B;
    --c-tint:#E7F0E9;
    --ipa:#7A5C9E;
    --ipa-tint:#EFE7F3;
    --good:#3F7168;
    --good-tint:#E1EEE9;
    --gentle:#B5544B;
    --gentle-tint:#F4E4E1;
    --radius:14px;
    --maxw:760px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth; font-size:87.5%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Lexend Deca','Lexend',sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.headline{ font-family:'Lexend',sans-serif; }
  a{color:var(--teal-dark);}
  button{ font-family:inherit; }

  .wrap{ max-width:var(--maxw); margin:0 auto; padding:20px 18px 80px; }

  header.top{
    padding:28px 18px 20px;
    border-bottom:1px solid var(--line);
    background:var(--bg);
    position:sticky; top:0; z-index:20;
  }
  header.top .inner{ max-width:var(--maxw); margin:0 auto; }
  header.top h1{ font-size:1.5rem; margin:0 0 4px; font-weight:700; letter-spacing:-0.01em; }
  header.top p{ margin:0; color:var(--ink-soft); font-size:0.95rem; }
  .backbar{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .backbtn{
    background:none; border:none; color:var(--teal-dark); font-size:0.95rem;
    cursor:pointer; padding:4px 0; display:flex; align-items:center; gap:6px; font-weight:500;
  }
  .backbtn:hover{ text-decoration:underline; }

  .overall-progress{
    margin-top:14px; height:8px; border-radius:6px; background:var(--line); overflow:hidden;
  }
  .overall-progress > div{ height:100%; background:var(--teal); border-radius:6px; transition:width .4s ease; }
  .overall-note{ font-size:0.82rem; color:var(--ink-soft); margin-top:6px; }

  .legend{
    display:flex; gap:10px; flex-wrap:wrap; margin:18px 0 6px;
  }
  .legend span{
    font-size:0.82rem; padding:5px 10px; border-radius:20px; font-weight:500;
  }
  .legend .A{ background:var(--a-tint); color:var(--a); }
  .legend .B{ background:var(--b-tint); color:var(--b); }
  .legend .C{ background:var(--c-tint); color:var(--c); }

  .section-title{
    font-size:1.05rem; font-weight:700; margin:30px 0 4px;
    display:flex; align-items:center; gap:10px;
  }
  .section-title .dot{ width:12px; height:12px; border-radius:50%; flex:none; }
  .section-desc{ color:var(--ink-soft); font-size:0.9rem; margin:0 0 14px; }

  .topic-grid{ display:flex; flex-direction:column; gap:10px; }
  .topic-card{
    background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; display:flex; align-items:center; justify-content:space-between;
    cursor:pointer; gap:12px; text-align:left; width:100%;
  }
  .topic-card:hover{ border-color:var(--teal); }
  .topic-card .tleft{ display:flex; flex-direction:column; gap:3px; }
  .topic-card .ttitle{ font-weight:600; font-size:0.98rem; }
  .topic-card .tmeta{ font-size:0.8rem; color:var(--ink-soft); }
  .check{
    width:26px; height:26px; border-radius:50%; flex:none; display:flex; align-items:center;
    justify-content:center; font-size:0.85rem; border:2px solid var(--line); color:transparent;
  }
  .check.done{ background:var(--good); border-color:var(--good); color:#fff; }
  .check.partial{ border-color:var(--teal); color:var(--teal); font-size:0.7rem; font-weight:700; }

  .c-list{ background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius); padding:6px 16px; }
  .c-item{ padding:12px 0; border-bottom:1px solid var(--line); }
  .c-item:last-child{ border-bottom:none; }
  .c-item .ttitle{ font-weight:600; font-size:0.95rem; margin-bottom:2px; }
  .c-item .tdesc{ font-size:0.88rem; color:var(--ink-soft); }

  .howto{
    background:var(--teal-tint); border-radius:var(--radius); padding:16px 18px; margin:20px 0 8px;
  }
  .howto h3{ margin:0 0 10px; font-size:0.95rem; color:var(--teal-dark); }
  .howto-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:520px){ .howto-grid{ grid-template-columns:1fr; } }
  .howto-item{ display:flex; gap:10px; align-items:flex-start; font-size:0.85rem; }

  .tips-entry{
    background:var(--bg-card); border:1.5px solid var(--teal); border-radius:var(--radius);
    padding:16px 18px; margin:18px 0 8px; display:flex; align-items:center; justify-content:space-between;
    cursor:pointer; gap:12px; width:100%; text-align:left;
  }
  .tips-entry:hover{ background:var(--teal-tint); }
  .tips-entry .tleft{ display:flex; flex-direction:column; gap:3px; }
  .tips-entry .ttitle{ font-weight:700; font-size:1rem; color:var(--teal-dark); }
  .tips-entry .tmeta{ font-size:0.85rem; color:var(--ink-soft); }
  .tips-entry .arrow{ font-size:1.3rem; color:var(--teal); flex:none; }

  .level-card{
    background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 14px; margin-bottom:10px; display:flex; gap:10px;
  }
  .level-num{
    flex:none; width:26px; height:26px; border-radius:50%; background:var(--teal); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.82rem;
  }
  .level-body{ flex:1; }
  .level-title{ font-weight:700; font-size:0.9rem; margin-bottom:2px; }
  .level-question{ font-size:0.8rem; color:var(--teal-dark); font-style:italic; margin-bottom:6px; }
  .level-signals{ display:flex; flex-wrap:wrap; gap:5px; margin-bottom:6px; }
  .signal-tag{ background:var(--teal-tint); color:var(--teal-dark); font-size:0.72rem; padding:2px 8px; border-radius:20px; }
  .level-example{ background:var(--bg); border-radius:8px; padding:8px 10px; font-size:0.78rem; margin-bottom:6px; }
  .level-example strong{ color:var(--ink); }
  .level-tip{ font-size:0.78rem; color:var(--ink-soft); }
  .level-tip strong{ color:var(--ink); }

  .worked-table{ width:100%; border-collapse:collapse; font-size:0.86rem; margin:10px 0 20px; }
  .worked-table th{ text-align:left; padding:8px 10px; border-bottom:2px solid var(--line); font-size:0.76rem; color:var(--ink-soft); }
  .worked-table td{ padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  .worked-table .wnum{ width:30px; height:30px; border-radius:50%; background:var(--teal); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.82rem; }

  .strategy-box{
    background:var(--b-tint); border-radius:var(--radius); padding:18px 20px; margin:20px 0;
  }
  .strategy-box h3{ margin:0 0 10px; font-size:0.95rem; color:var(--b); }
  .strategy-box ol{ margin:0; padding-left:20px; }
  .strategy-box li{ margin-bottom:8px; font-size:0.9rem; }

  .accordion-item{ border:1px solid var(--line); border-radius:var(--radius); margin-bottom:8px; overflow:hidden; background:var(--bg-card); }
  .accordion-header{
    width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:none; border:none; padding:12px 14px; cursor:pointer; text-align:left; font-family:inherit;
  }
  .accordion-header:hover{ background:var(--teal-tint); }
  .accordion-title{ display:flex; align-items:center; gap:8px; font-weight:700; font-size:0.85rem; }
  .accordion-chevron{ font-size:0.85rem; color:var(--ink-soft); transition:transform .2s ease; flex:none; }
  .accordion-chevron.open{ transform:rotate(180deg); }
  .accordion-body{ padding:0 14px 14px; }

  .karten-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:10px; margin-top:6px; }
  .karte{ border-radius:12px; padding:12px; border:1.5px solid var(--line); border-left:5px solid var(--k-color, var(--teal)); background:var(--bg); }
  .karte-emoji{ font-size:1rem; margin-right:5px; }
  .karte-title{ font-weight:700; font-size:0.8rem; margin-bottom:8px; line-height:1.35; }
  .karte-sub{ font-size:0.68rem; color:var(--ink-soft); margin-bottom:2px; text-transform:uppercase; letter-spacing:0.02em; }
  .karte-action{ font-size:0.8rem; font-weight:500; }

  .story-wrap{ background:var(--bg-card); border:1.5px solid var(--teal); border-radius:var(--radius); padding:14px 16px 6px; margin:14px 0 20px; }
  .story-situation{ background:var(--teal-tint); border-radius:10px; padding:10px 12px; font-size:0.85rem; margin-bottom:12px; color:var(--teal-dark); font-weight:500; }
  .story-step{ display:flex; gap:10px; align-items:flex-start; margin-bottom:10px; }
  .story-step .snum{ flex:none; width:24px; height:24px; border-radius:50%; background:var(--teal); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.75rem; }
  .story-step .stext{ flex:1; padding-top:3px; }
  .story-step .slabel{ font-weight:700; font-size:0.88rem; margin-bottom:2px; }
  .story-step .sbody{ font-size:0.92rem; }
  .story-connector{ width:2px; height:10px; background:var(--line); margin-left:14px; }
  .howto-icon{
    width:28px; height:28px; border-radius:8px; background:#fff; display:flex; align-items:center;
    justify-content:center; flex:none; font-size:1rem;
  }

  /* topic view */
  .badge{
    display:inline-block; font-size:0.78rem; font-weight:600; padding:4px 10px; border-radius:20px;
    margin-bottom:10px;
  }
  .badge.A{ background:var(--a-tint); color:var(--a); }
  .badge.B{ background:var(--b-tint); color:var(--b); }
  .badge.C{ background:var(--c-tint); color:var(--c); }
  .badge.IPA{ background:var(--ipa-tint); color:var(--ipa); }
  .legend .IPA{ background:var(--ipa-tint); color:var(--ipa); }

  .comp-table{ width:100%; border-collapse:collapse; font-size:0.88rem; }
  .comp-table th{ text-align:left; font-weight:600; padding:8px 10px; border-bottom:2px solid var(--line); color:var(--ink-soft); font-size:0.78rem; }
  .comp-table td{ padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
  .comp-table tr:last-child td{ border-bottom:none; }
  .comp-hkb-row td{ background:var(--teal-tint); font-weight:600; color:var(--teal-dark); padding:7px 10px; font-size:0.82rem; }
  .comp-code{ font-weight:700; color:var(--ipa); white-space:nowrap; }
  .comp-status{ text-align:center; width:34px; }
  .comp-check{ display:inline-flex; width:22px; height:22px; border-radius:50%; align-items:center; justify-content:center; font-size:0.72rem; border:2px solid var(--line); color:transparent; }
  .comp-check.ok{ background:var(--good); border-color:var(--good); color:#fff; }
  .comp-check.open{ border-color:var(--ipa); color:var(--ipa); font-weight:700; }
  .comp-goto{ background:none; border:1px solid var(--line); border-radius:20px; padding:4px 10px; font-size:0.78rem; cursor:pointer; color:var(--ink); }
  .comp-goto:hover{ border-color:var(--ipa); color:var(--ipa); }
  .comp-note{ font-size:0.82rem; color:var(--ink-soft); margin:6px 0 16px; }

  .matrix-entry{
    background:var(--bg-card); border:1.5px solid var(--ipa); border-radius:var(--radius);
    padding:16px 18px; margin:10px 0 8px; display:flex; align-items:center; justify-content:space-between;
    cursor:pointer; gap:12px; width:100%; text-align:left;
  }
  .matrix-entry:hover{ background:var(--ipa-tint); }
  .matrix-entry .ttitle{ font-weight:700; font-size:1rem; color:var(--ipa); }
  .matrix-entry .tmeta{ font-size:0.85rem; color:var(--ink-soft); }
  .matrix-entry .arrow{ font-size:1.3rem; color:var(--ipa); flex:none; }

  .matrix-scroll{ overflow-x:auto; margin-bottom:8px; -webkit-overflow-scrolling:touch; }
  .matrix-table{ border-collapse:collapse; font-size:0.82rem; min-width:640px; width:100%; }
  .matrix-table th{ text-align:center; padding:8px 6px; border-bottom:2px solid var(--line); font-size:0.72rem; color:var(--ink-soft); font-weight:600; vertical-align:bottom; }
  .matrix-table th.rowhead{ text-align:left; }
  .matrix-table td{ padding:7px 6px; border-bottom:1px solid var(--line); text-align:center; }
  .matrix-table td.rowhead{ text-align:left; }
  .matrix-hkb-row td{ background:var(--teal-tint); font-weight:600; color:var(--teal-dark); padding:6px 10px; font-size:0.8rem; }
  .matrix-code{ font-weight:700; color:var(--ipa); white-space:nowrap; }
  .matrix-label{ font-size:0.8rem; color:var(--ink); }
  .cell-ok{ display:inline-flex; width:22px; height:22px; border-radius:50%; background:var(--good); color:#fff; align-items:center; justify-content:center; font-size:0.75rem; font-weight:700; }
  .cell-gap{ display:inline-flex; width:22px; height:22px; border-radius:50%; background:var(--gentle-tint); color:var(--gentle); align-items:center; justify-content:center; font-size:0.75rem; }
  .matrix-total-row td{ font-weight:700; border-top:2px solid var(--line); border-bottom:none; }
  .matrix-legend{ display:flex; gap:16px; flex-wrap:wrap; font-size:0.8rem; color:var(--ink-soft); margin:8px 0 18px; }
  .matrix-legend span{ display:inline-flex; align-items:center; gap:6px; }

  .topic-title{ font-size:1.35rem; margin:0 0 14px; }

  .explain-card{
    background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 20px; margin-bottom:18px;
  }
  .explain-card ul{ margin:8px 0 0; padding-left:20px; }
  .explain-card li{ margin-bottom:6px; }
  .explain-card p{ margin:0 0 8px; }

  .startbtn, .primary-btn{
    background:var(--teal); color:#fff; border:none; border-radius:10px; padding:12px 20px;
    font-size:0.95rem; font-weight:600; cursor:pointer;
  }
  .startbtn:hover, .primary-btn:hover{ background:var(--teal-dark); }
  .ghost-btn{
    background:none; border:1px solid var(--line); border-radius:10px; padding:11px 18px;
    font-size:0.9rem; font-weight:500; cursor:pointer; color:var(--ink);
  }
  .ghost-btn:hover{ border-color:var(--teal); }

  .qwrap{ background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius); padding:20px; }
  .qprogress{ font-size:0.8rem; color:var(--ink-soft); margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; }
  .qtype-tag{
    display:inline-flex; align-items:center; gap:6px; font-size:0.78rem; font-weight:600;
    background:var(--teal-tint); color:var(--teal-dark); padding:4px 10px; border-radius:20px; margin-bottom:12px;
  }
  .qprompt{ font-size:1.02rem; font-weight:500; margin-bottom:16px; }
  .qcontext{ font-size:0.88rem; color:var(--ink-soft); margin-bottom:10px; font-style:italic; }

  .options{ display:flex; flex-direction:column; gap:8px; }
  .opt{
    text-align:left; background:#fff; border:1.5px solid var(--line); border-radius:10px;
    padding:12px 14px; cursor:pointer; font-size:0.94rem; color:var(--ink); width:100%;
  }
  .opt:hover{ border-color:var(--teal); }
  .opt.correct{ border-color:var(--good); background:var(--good-tint); }
  .opt.wrong{ border-color:var(--gentle); background:var(--gentle-tint); }
  .opt[disabled]{ cursor:default; }

  .tfbtns{ display:flex; gap:10px; }
  .tfbtns button{
    flex:1; padding:14px; border-radius:10px; border:1.5px solid var(--line); background:#fff;
    font-size:0.95rem; font-weight:600; cursor:pointer;
  }
  .tfbtns button:hover{ border-color:var(--teal); }
  .tfbtns button.correct{ border-color:var(--good); background:var(--good-tint); }
  .tfbtns button.wrong{ border-color:var(--gentle); background:var(--gentle-tint); }

  .multitf-row{ border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .multitf-statement{ font-size:0.92rem; margin-bottom:10px; line-height:1.5; }
  .multitf-row .tfbtns button{ padding:10px; font-size:0.88rem; }
  .multitf-reason{ margin-top:10px; font-size:0.85rem; color:var(--ink); background:var(--bg); border-radius:8px; padding:9px 11px; line-height:1.5; }
  .multitf-progress{ font-size:0.8rem; color:var(--ink-soft); margin-bottom:12px; }

  .feedback{
    margin-top:16px; padding:14px 16px; border-radius:10px; font-size:0.92rem;
  }
  .feedback.good{ background:var(--good-tint); color:var(--teal-dark); }
  .feedback.gentle{ background:var(--gentle-tint); color:#7A362F; }
  .feedback strong{ display:block; margin-bottom:4px; }

  textarea{
    width:100%; min-height:90px; border:1.5px solid var(--line); border-radius:10px; padding:12px;
    font-family:inherit; font-size:0.94rem; resize:vertical;
  }
  textarea:focus{ outline:2px solid var(--teal); border-color:var(--teal); }

  .modelanswer{
    margin-top:12px; background:var(--teal-tint); border-radius:10px; padding:14px 16px; font-size:0.92rem;
  }
  .modelanswer strong{ display:block; margin-bottom:4px; color:var(--teal-dark); }

  .selfrate{ display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
  .selfrate button{
    border-radius:10px; padding:10px 14px; font-size:0.88rem; font-weight:600; cursor:pointer; border:1.5px solid var(--line); background:#fff;
  }
  .selfrate button.active-good{ border-color:var(--good); background:var(--good-tint); color:var(--teal-dark); }
  .selfrate button.active-practice{ border-color:var(--b); background:var(--b-tint); color:var(--b); }

  .qnav{ display:flex; justify-content:space-between; align-items:center; margin-top:20px; }

  .done-screen{ text-align:center; padding:40px 20px; }
  .done-screen .big-check{
    width:64px; height:64px; border-radius:50%; background:var(--good-tint); color:var(--teal-dark);
    display:flex; align-items:center; justify-content:center; font-size:1.8rem; margin:0 auto 16px;
  }

  .zuordnen-row{ display:flex; gap:10px; margin-top:4px; }

  .matchmulti-row{ border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .matchmulti-statement{ font-size:0.92rem; margin-bottom:10px; line-height:1.5; }
  .matchmulti-options{ display:flex; flex-wrap:wrap; gap:8px; }
  .matchmulti-options button{ padding:8px 12px; border-radius:20px; border:1.5px solid var(--line); background:#fff; font-size:0.83rem; cursor:pointer; }
  .matchmulti-options button:hover{ border-color:var(--teal); }
  .matchmulti-options button.correct{ border-color:var(--good); background:var(--good-tint); font-weight:600; }
  .matchmulti-options button.wrong{ border-color:var(--gentle); background:var(--gentle-tint); }
  .zuordnen-row button{ flex:1; }

  footer.foot{ text-align:center; color:var(--ink-soft); font-size:0.8rem; padding:30px 20px 10px; }

  .kicker{ font-size:0.85rem; color:var(--ink-soft); margin-bottom:2px; }

  ::selection{ background:var(--teal-tint); }
</style>
</head>
<body>

<header class="top">
  <div class="inner" id="headerInner">
    <h1>AGS Prüfungs-Kern</h1>
    <p>Ruhig üben, Thema für Thema. Alles, was oft dran kommt, zuerst.</p>
    <div class="overall-progress"><div id="overallBar" style="width:0%"></div></div>
    <div class="overall-note" id="overallNote">0 von 0 Themen geübt</div>
  </div>
</header>

<div class="wrap" id="app"></div>

<footer class="foot">Lernhilfe auf Basis des Bildungsplans AGS EBA und früherer Übungsprüfungen (OdA Gesundheit Zürich). Dein Fortschritt wird nur in diesem Browser-Fenster gemerkt.</footer>

<script>
/* ---------------------------------------------------------
   DATA
--------------------------------------------------------- */

const PRIORITY_INFO = {
  A: {label:'A – Muss sitzen', desc:'Kommt sehr oft vor, in mehreren Prüfungsteilen. Diese Themen zuerst lernen.'},
  B: {label:'B – Sehr wahrscheinlich', desc:'Kommt häufig vor. Gut vorbereiten, wenn A sitzt.'},
  C: {label:'C – Ergänzungswissen', desc:'Kann vorkommen, ist aber nicht der Schwerpunkt.'}
};

// Question type helpers
// mc          -> {type:'mc', context, prompt, options:[...], correct:index, explain}
// tf          -> {type:'tf', context, prompt, correct:true/false, explainTrue, explainFalse, correction}
// beob        -> {type:'beob', context, statement, correct:'beobachtung'|'interpretation', explain}
// frei        -> {type:'frei', context, prompt, model}

  if(type==='mc') return 'Richtigen Eintrag auswählen';
  if(type==='tf') return 'Richtig oder falsch – korrigieren';
  if(type==='beob') return 'Beobachtung oder Interpretation?';
  if(type==='frei') return 'Eigene Antwort formulieren';
  if(type==='multitf') return 'Tue ich / tue ich nicht – mehrere Aussagen';
  if(type==='matchmulti') return 'Begriffen zuordnen';
  return '';
}

function topicDone(t){
  const p = state.progress[t.id];
  return p.answered.size >= p.total;
}
function topicPartial(t){
  const p = state.progress[t.id];
  return p.answered.size > 0 && p.answered.size < p.total;
}

function renderOverview(){
  const doneCount = allTopics.filter(topicDone).length;
  document.getElementById('overallBar').style.width = Math.round(100*doneCount/allTopics.length)+'%';
  document.getElementById('overallNote').textContent = doneCount+' von '+allTopics.length+' Themen geübt';

  let html = '';
  html += `<div class="legend">
    <span class="A">A – Muss sitzen</span>
    <span class="B">B – Sehr wahrscheinlich</span>
    <span class="C">C – Ergänzung</span>
    <span class="IPA">IPA – Praxisprüfung</span>
  </div>`;

  html += `<button class="tips-entry" onclick="openTips()">
    <div class="tleft">
      <div class="ttitle">📘 Lerntipps: Wie die Prüfung "denkt"</div>
      <div class="tmeta">Die immer gleiche Logik hinter den Aufgaben verstehen – 6 Ebenen, an einem echten Beispiel erklärt</div>
    </div>
    <div class="arrow">→</div>
  </button>`;

  html += `<button class="matrix-entry" onclick="openMatrix()">
    <div class="tleft">
      <div class="ttitle">📊 Kompetenz-Ebenen-Matrix</div>
      <div class="tmeta">Welche der 6 Denkebenen ist zu welcher Prüfungskompetenz schon geübt? Wird laufend aktualisiert.</div>
    </div>
    <div class="arrow">→</div>
  </button>`;

  html += `<div class="howto">
    <h3>So erkennst du die Aufgabentypen</h3>
    <div class="howto-grid">
      <div class="howto-item"><div class="howto-icon">✓</div><div>Richtigen Eintrag auswählen – eine von mehreren Antworten stimmt.</div></div>
      <div class="howto-item"><div class="howto-icon">↺</div><div>Richtig/falsch – bei falsch zeigen wir dir gleich die Korrektur.</div></div>
      <div class="howto-item"><div class="howto-icon">👁</div><div>Beobachtung oder Interpretation – reiner Fakt oder eigene Deutung?</div></div>
      <div class="howto-item"><div class="howto-icon">✎</div><div>Eigene Antwort formulieren – du schreibst, wir zeigen eine Musterantwort.</div></div>
    </div>
  </div>`;

  html += renderSection('A', topicsA);
  html += renderSection('B', [...topicsB, ...topicsBerufsrolle]);

  html += `<div class="section-title"><span class="dot" style="background:var(--c)"></span>${PRIORITY_INFO.C.label}</div>
  <p class="section-desc">${PRIORITY_INFO.C.desc}</p>
  <div class="c-list">`;
  topicsC.forEach(t=>{
    html += `<div class="c-item"><div class="ttitle">${t.title}</div><div class="tdesc">${t.desc}</div></div>`;
  });
  html += `</div>`;

  html += `<div class="section-title"><span class="dot" style="background:var(--ipa)"></span>IPA – Praxisprüfung</div>
  <p class="section-desc">Für die praktische Prüfung wählt die vorgesetzte Fachkraft 6 dieser Kompetenzen aus (je 2 aus Bereich 1+2, je 1 aus Bereich 3+5). Diese Übungen decken alle wählbaren Kompetenzen ab.</p>
  <div class="topic-grid">`;
  topicsIPA.forEach(t=>{
    const p = state.progress[t.id];
    let checkClass = '', checkContent='';
    if(topicDone(t)){ checkClass='done'; checkContent='✓'; }
    else if(topicPartial(t)){ checkClass='partial'; checkContent=p.answered.size+'/'+p.total; }
    html += `<button class="topic-card" id="card-${t.id}">
      <div class="tleft">
        <div class="ttitle">${t.title} <span style="color:var(--ipa); font-weight:600;">· K ${t.comp}</span></div>
        <div class="tmeta">${t.questions.length} Aufgaben</div>
      </div>
      <div class="check ${checkClass}">${checkContent}</div>
    </button>`;
  });
  html += `</div>`;

  html += renderCompetencyChecklist();

  app.innerHTML = html;

  allTopics.forEach(t=>{
    const el = document.getElementById('card-'+t.id);
    if(el) el.addEventListener('click', ()=> openTopic(t.id));
  });
  document.querySelectorAll('.comp-goto').forEach(btn=>{
    btn.addEventListener('click', ()=> openTopic(btn.dataset.topic));
  });
}

function renderCompetencyChecklist(){
  let html = `<div class="section-title" style="margin-top:36px;"><span class="dot" style="background:var(--ipa)"></span>Kompetenzen-Checkliste (IPA)</div>
  <p class="section-desc">Alle 19 Handlungskompetenzen, aus denen deine 6 Prüfungskompetenzen ausgewählt werden. Zu jeder gibt es hier eine passende Übung.</p>
  <table class="comp-table"><thead><tr><th>Code</th><th>Kompetenz</th><th class="comp-status">Geübt</th><th></th></tr></thead><tbody>`;
  IPA_COMPETENCIES.forEach(group=>{
    html += `<tr class="comp-hkb-row"><td colspan="4">Handlungskompetenzbereich ${group.hkb} — ${group.title}</td></tr>`;
    group.items.forEach(item=>{
      const topic = getTopic(item.topicId);
      const p = topic ? state.progress[item.topicId] : null;
      const done = p && p.answered.size >= p.total;
      html += `<tr>
        <td class="comp-code">${item.code}</td>
        <td>${item.label}</td>
        <td class="comp-status"><span class="comp-check ${done?'ok':'open'}">${done?'✓':'○'}</span></td>
        <td><button class="comp-goto" data-topic="${item.topicId}">Üben</button></td>
      </tr>`;
    });
  });
  html += `</tbody></table>
  <p class="comp-note">Alle 19 Kompetenzen sind mit mindestens einer Übung hinterlegt — egal welche 6 deine vorgesetzte Fachkraft für deine IPA auswählt, du hast dazu passendes Material.</p>`;
  return html;
}

function renderSection(letter, list){
  const color = letter==='A' ? 'var(--a)' : 'var(--b)';
  let html = `<div class="section-title"><span class="dot" style="background:${color}"></span>${PRIORITY_INFO[letter].label}</div>
  <p class="section-desc">${PRIORITY_INFO[letter].desc}</p>
  <div class="topic-grid">`;
  list.forEach(t=>{
    const p = state.progress[t.id];
    let checkClass = '', checkContent='';
    if(topicDone(t)){ checkClass='done'; checkContent='✓'; }
    else if(topicPartial(t)){ checkClass='partial'; checkContent=p.answered.size+'/'+p.total; }
    html += `<button class="topic-card" id="card-${t.id}">
      <div class="tleft">
        <div class="ttitle">${t.title}</div>
        <div class="tmeta">${t.questions.length} Aufgaben</div>
      </div>
      <div class="check ${checkClass}">${checkContent}</div>
    </button>`;
  });
  html += `</div>`;
  return html;
}

function openTopic(id){
  state.topicId = id;
  state.qIndex = 0;
  state.view = 'topic-intro';
  renderTopic();
  window.scrollTo({top:0, behavior:'smooth'});
}

function getTopic(id){ return allTopics.find(t=>t.id===id); }

function renderTopic(){
  const t = getTopic(state.topicId);
  if(!t) return renderOverview();

  if(state.view === 'topic-intro'){
    let html = `<button class="backbtn" onclick="goOverview()">← Übersicht</button>`;
    const prioLabel = t.priority==='A' ? 'Muss sitzen' : (t.priority==='B' ? 'Sehr wahrscheinlich' : 'Praxis (IPA) · Kompetenz '+t.comp);
    html += `<span class="badge ${t.priority}">${prioLabel}</span>`;
    html += `<h2 class="topic-title">${t.title}</h2>`;
    html += `<div class="explain-card"><ul>`;
    t.intro.forEach(line=>{ html += `<li>${line}</li>`; });
    html += `</ul></div>`;
    html += `<button class="startbtn" onclick="startQuestions()">Aufgaben starten (${t.questions.length})</button>`;
    app.innerHTML = html;
    return;
  }

  if(state.view === 'topic-done'){
    let html = `<button class="backbtn" onclick="goOverview()">← Übersicht</button>`;
    html += `<div class="done-screen">
      <div class="big-check">✓</div>
      <h2>Gut gemacht!</h2>
      <p>Du hast alle Aufgaben zu „${t.title}“ durchgearbeitet.</p>
      <button class="primary-btn" onclick="goOverview()">Zur Übersicht</button>
    </div>`;
    app.innerHTML = html;
    return;
  }

  // question view
  const q = t.questions[state.qIndex];
  const key = t.id+'-'+state.qIndex;
  if(!answerState[key]) answerState[key] = (q.type==='multitf' || q.type==='matchmulti')
    ? {answered:false, rows:q.rows.map(()=>({selected:null}))}
    : {answered:false, selected:null};

  let html = `<button class="backbtn" onclick="goOverview()">← Übersicht</button>`;
  html += `<span class="badge ${t.priority}">${t.title}</span>`;
  html += `<div class="qwrap">`;
  html += `<div class="qprogress"><span>Frage ${state.qIndex+1} von ${t.questions.length}</span></div>`;
  html += `<div class="qtype-tag">${iconFor(q.type)} ${labelFor(q.type)}</div>`;
  if(q.context) html += `<div class="qcontext">${q.context}</div>`;

  if(q.type==='mc'){
    html += renderMC(t, q, key);
  } else if(q.type==='tf'){
    html += renderTF(t, q, key);
  } else if(q.type==='beob'){
    html += renderBeob(t, q, key);
  } else if(q.type==='frei'){
    html += renderFrei(t, q, key);
  } else if(q.type==='multitf'){
    html += renderMultiTF(t, q, key);
  } else if(q.type==='matchmulti'){
    html += renderMatchMulti(t, q, key);
  }

  html += `</div>`; // qwrap

  html += `<div class="qnav">
    <button class="ghost-btn" onclick="prevQuestion()" ${state.qIndex===0?'disabled style="visibility:hidden"':''}>Zurück</button>
    <button class="primary-btn" id="nextBtn" onclick="nextQuestion()" ${answerState[key].answered?'':'style="display:none"'}>
      ${state.qIndex === t.questions.length-1 ? 'Fertig' : 'Weiter'}
    </button>
  </div>`;

  app.innerHTML = html;
}

function renderMC(t,q,key){
  const st = answerState[key];
  let html = `<div class="qprompt">${q.prompt}</div><div class="options">`;
  q.options.forEach((opt,i)=>{
    let cls='opt';
    if(st.answered){
      if(i===q.correct) cls+=' correct';
      else if(i===st.selected) cls+=' wrong';
    }
    html += `<button class="${cls}" ${st.answered?'disabled':''} onclick="answerMC('${key}',${i})">${opt}</button>`;
  });
  html += `</div>`;
  if(st.answered){
    const good = st.selected===q.correct;
    html += `<div class="feedback ${good?'good':'gentle'}"><strong>${good?'Genau richtig.':'Nicht ganz – so ist es richtig:'}</strong>${q.explain}</div>`;
  }
  return html;
}

function renderTF(t,q,key){
  const st = answerState[key];
  let html = `<div class="qprompt">${q.prompt}</div>`;
  html += `<div class="tfbtns">
    <button ${st.answered?'disabled':''} class="${st.answered ? (q.correct===true?'correct':(st.selected===true?'wrong':'')) : ''}" onclick="answerTF('${key}',true)">Richtig</button>
    <button ${st.answered?'disabled':''} class="${st.answered ? (q.correct===false?'correct':(st.selected===false?'wrong':'')) : ''}" onclick="answerTF('${key}',false)">Falsch</button>
  </div>`;
  if(st.answered){
    const good = st.selected===q.correct;
    let msg = good ? (q.correct? q.explainTrue : q.explainFalse) : (q.correct ? q.explainTrue : ('Nicht ganz. '+q.correction));
    if(good && !msg) msg = 'Genau, das hast du richtig eingeschätzt.';
    html += `<div class="feedback ${good?'good':'gentle'}"><strong>${good?'Richtig erkannt.':'Nicht ganz.'}</strong>${msg}</div>`;
  }
  return html;
}

function renderBeob(t,q,key){
  const st = answerState[key];
  let html = `<div class="qprompt">${q.statement}</div>`;
  html += `<div class="zuordnen-row">
    <button class="opt ${st.answered ? (q.correct==='beobachtung'?'correct':(st.selected==='beobachtung'?'wrong':'')) : ''}" ${st.answered?'disabled':''} onclick="answerBeob('${key}','beobachtung')">Beobachtung</button>
    <button class="opt ${st.answered ? (q.correct==='interpretation'?'correct':(st.selected==='interpretation'?'wrong':'')) : ''}" ${st.answered?'disabled':''} onclick="answerBeob('${key}','interpretation')">Interpretation</button>
  </div>`;
  if(st.answered){
    const good = st.selected===q.correct;
    html += `<div class="feedback ${good?'good':'gentle'}"><strong>${good?'Genau richtig.':'Nicht ganz – so ist es gemeint:'}</strong>${q.explain}</div>`;
  }
  return html;
}

function renderFrei(t,q,key){
  const st = answerState[key];
  let html = `<div class="qprompt">${q.prompt}</div>`;
  html += `<textarea id="ta-${key}" placeholder="Schreibe hier deine Antwort..." ${st.answered?'disabled':''}>${st.text||''}</textarea>`;
  if(!st.answered){
    html += `<div style="margin-top:10px;"><button class="ghost-btn" onclick="showModel('${key}')">Musterantwort zeigen</button></div>`;
  } else {
    html += `<div class="modelanswer"><strong>Musterantwort</strong>${q.model}</div>`;
    html += `<div class="selfrate">
      <span style="align-self:center; font-size:0.85rem; color:var(--ink-soft);">Wie war das für dich?</span>
      <button class="${st.rating==='good'?'active-good':''}" onclick="rateSelf('${key}','good')">Das sass gut 👍</button>
      <button class="${st.rating==='practice'?'active-practice':''}" onclick="rateSelf('${key}','practice')">Muss ich noch üben</button>
    </div>`;
  }
  return html;
}

function renderMultiTF(t,q,key){
  const st = answerState[key];
  const labels = q.labels || ['Tue ich','Tue ich nicht'];
  const doneCount = st.rows.filter(r=>r.selected!==null).length;
  let html = `<div class="qprompt">${q.prompt}</div>`;
  html += `<div class="multitf-progress">${doneCount} von ${q.rows.length} Aussagen beurteilt</div>`;
  q.rows.forEach((row,i)=>{
    const sel = st.rows[i].selected;
    const done = sel !== null;
    html += `<div class="multitf-row">
      <div class="multitf-statement">${row.statement}</div>
      <div class="tfbtns">
        <button ${done?'disabled':''} class="${done ? (row.correct===true?'correct':(sel===true?'wrong':'')) : ''}" onclick="answerMultiRow('${key}',${i},true)">${labels[0]}</button>
        <button ${done?'disabled':''} class="${done ? (row.correct===false?'correct':(sel===false?'wrong':'')) : ''}" onclick="answerMultiRow('${key}',${i},false)">${labels[1]}</button>
      </div>
      ${done && row.reason ? `<div class="multitf-reason"><strong>${sel===row.correct?'Richtig eingeschätzt.':'Nicht ganz.'}</strong> ${row.reason}</div>` : ''}
    </div>`;
  });
  if(st.answered){
    html += `<div class="feedback good"><strong>Alle Aussagen beurteilt.</strong> Vergleiche deine Einschätzungen oben mit den Begründungen.</div>`;
  }
  return html;
}

function renderMatchMulti(t,q,key){
  const st = answerState[key];
  const doneCount = st.rows.filter(r=>r.selected!==null).length;
  let html = `<div class="qprompt">${q.prompt}</div>`;
  html += `<div class="multitf-progress">${doneCount} von ${q.rows.length} zugeordnet</div>`;
  q.rows.forEach((row,i)=>{
    const sel = st.rows[i].selected;
    const done = sel !== null;
    html += `<div class="matchmulti-row">
      <div class="matchmulti-statement">${row.statement}</div>
      <div class="matchmulti-options">`;
    q.categories.forEach(cat=>{
      let cls='';
      if(done){
        if(cat===row.category) cls='correct';
        else if(cat===sel) cls='wrong';
      }
      html += `<button class="${cls}" ${done?'disabled':''} onclick="answerMatchRow('${key}',${i},${JSON.stringify(cat)})">${cat}</button>`;
    });
    html += `</div></div>`;
  });
  if(st.answered){
    html += `<div class="feedback good"><strong>Alle Zuordnungen gemacht.</strong> Die richtige Zuordnung ist jeweils grün markiert.</div>`;
  }
  return html;
}

/* ---------------------------------------------------------
   INTERACTIONS
--------------------------------------------------------- */
function markAnswered(topicId, qIndex){
  state.progress[topicId].answered.add(qIndex);
}

window.answerMC = function(key, i){
  answerState[key].answered = true;
  answerState[key].selected = i;
  const [topicId, qIndex] = splitKey(key);
  markAnswered(topicId, parseInt(qIndex));
  renderTopic();
};
window.answerTF = function(key, val){
  answerState[key].answered = true;
  answerState[key].selected = val;
  const [topicId, qIndex] = splitKey(key);
  markAnswered(topicId, parseInt(qIndex));
  renderTopic();
};
window.answerBeob = function(key, val){
  answerState[key].answered = true;
  answerState[key].selected = val;
  const [topicId, qIndex] = splitKey(key);
  markAnswered(topicId, parseInt(qIndex));
  renderTopic();
};
window.answerMultiRow = function(key, i, val){
  const st = answerState[key];
  st.rows[i].selected = val;
  const allDone = st.rows.every(r=>r.selected!==null);
  if(allDone && !st.answered){
    st.answered = true;
    const [topicId, qIndex] = splitKey(key);
    markAnswered(topicId, parseInt(qIndex));
  }
  renderTopic();
};
window.answerMatchRow = function(key, i, cat){
  const st = answerState[key];
  st.rows[i].selected = cat;
  const allDone = st.rows.every(r=>r.selected!==null);
  if(allDone && !st.answered){
    st.answered = true;
    const [topicId, qIndex] = splitKey(key);
    markAnswered(topicId, parseInt(qIndex));
  }
  renderTopic();
};
window.showModel = function(key){
  const ta = document.getElementById('ta-'+key);
  answerState[key].text = ta ? ta.value : '';
  answerState[key].answered = true;
  const [topicId, qIndex] = splitKey(key);
  markAnswered(topicId, parseInt(qIndex));
  renderTopic();
};
window.rateSelf = function(key, val){
  answerState[key].rating = val;
  renderTopic();
};

function splitKey(key){
  const idx = key.lastIndexOf('-');
  return [key.substring(0,idx), key.substring(idx+1)];
}

window.startQuestions = function(){
  state.view = 'question';
  state.qIndex = 0;
  renderTopic();
};

window.nextQuestion = function(){
  const t = getTopic(state.topicId);
  if(state.qIndex < t.questions.length-1){
    state.qIndex++;
    state.view='question';
    renderTopic();
  } else {
    state.view = 'topic-done';
    renderTopic();
  }
  window.scrollTo({top:0, behavior:'smooth'});
};
window.prevQuestion = function(){
  if(state.qIndex>0){
    state.qIndex--;
    renderTopic();
  }
};

      <li>Bei Dokumentation: strikt zwischen beobachtbarer Information und eigener Interpretation unterscheiden.</li>
      <li>Bei Situationen mit Einschränkungen: immer Ressourcen, Sicherheit und Selbstbestimmung gleichzeitig berücksichtigen.</li>
      <li>Bei auffälligen Beobachtungen: nicht selbst diagnostizieren, sondern korrekt beobachten und die zuständige Fachperson informieren.</li>
    </ul>
  </div>`;
  html += renderAccordionSection('technik', 'Besonders wichtige Prüfungstechniken', 'var(--a)', body3);

  let bodyKarten = `<p class="section-desc" style="margin-top:0;">Die 5 häufigsten Signalwörter – auf einen Blick, wie Karteikarten. Bei jeder Aufgabe zuerst das Signalwort suchen, dann die passende Karte anwenden.</p>
  <div class="karten-grid">`;
  FRAGETYP_KARTEN.forEach(k=>{
    bodyKarten += `<div class="karte" style="--k-color:${k.color};">
      <div class="karte-title"><span class="karte-emoji">${k.emoji}</span>${k.title}</div>
      <div class="karte-sub">Was tun?</div>
      <div class="karte-action">→ ${k.action}</div>
    </div>`;
  });
  bodyKarten += `</div>`;
  html += renderAccordionSection('karten', 'Karteikarten-Sammlung: 5 Fragetypen auf einen Blick', 'var(--gentle)', bodyKarten);

  let body4 = `<div class="explain-card" style="margin-top:0;">
    <p><strong>2018 – die Prüfung ist breit gefächert.</strong> Innerhalb eines einzigen Prüfungsteils werden Vitalzeichen, Anatomie, Prophylaxe, Mobilisation, Hygiene, Privatsphäre, Kommunikation, Materialbestellung, Dokumentation und Stressbewältigung abgefragt – nacheinander, in derselben Situation. Das spricht dafür, den Lernstoff nach Handlungskompetenzen zu ordnen statt nach einzelnen Krankheitsbildern – genau das machen die Themen-Kacheln in diesem Lernmodul.</p>
    <p><strong>2019 – dasselbe Grundprinzip, bestätigt.</strong> In Teil 2 wird die Pflegedokumentation zum Beispiel anhand konkreter Einträge geprüft: Du musst entscheiden, ob ein Eintrag korrekt ist, und das begründen. Beide Jahrgänge nennen zudem ausdrücklich, wie viele Antworten verlangt sind – zusätzliche, überzählige Antworten bringen keine Extrapunkte, sie werden einfach nicht bewertet.</p>
  </div>`;
  html += renderAccordionSection('jahre', 'Was die echten Prüfungen 2018 und 2019 zusätzlich zeigen', 'var(--b)', body4);

  let body5 = `<div class="explain-card" style="margin-top:0;">
    <p><span class="badge A" style="margin-right:6px;">A</span>Hygiene, Körperpflege/Intimsphäre, Mobilisation/Sicherheit, Beobachtung/Weitergabe, Dokumentation.</p>
    <p><span class="badge B" style="margin-right:6px;">B</span>Flüssigkeit/Ausscheidung, Prophylaxen, Kommunikation/Haltung, Ergonomie/Arbeitssicherheit.</p>
    <p><span class="badge C" style="margin-right:6px;">C</span>Anatomie/Fachbegriffe, Berechnungen, Aktivierung und Alltagsorganisation.</p>
    <p style="margin-top:10px;"><strong>Nicht separat lernen:</strong> Themen werden in der Prüfung immer miteinander kombiniert. Das ist auch der Grund, warum viele Übungen in diesem Lernmodul mehrere Themen in einer Situation verbinden, statt sie künstlich zu trennen.</p>
  </div>`;
  html += renderAccordionSection('prioritaeten', 'Vorläufige Prioritäten für die weitere Auswertung', 'var(--c)', body5);

  let body6 = `<div class="strategy-box" style="margin-top:0;">
    <ol>
      <li><strong>Lies die Situation zweimal.</strong> Wer ist die Person, was ist gerade passiert?</li>
      <li><strong>Suche das Signalwort</strong> in der Aufgabe (z. B. „Begründen Sie“, „Nennen Sie“, „Was tun Sie“).</li>
      <li><strong>Ordne es einer der 6 Ebenen zu</strong> – das sagt dir, was für eine Antwort erwartet wird.</li>
      <li><strong>Antworte nur auf dieser Ebene.</strong> Bei „Begründen Sie“ reicht keine blosse Handlung, bei „Beschreiben Sie“ reicht kein Prinzip ohne konkrete Handlung.</li>
      <li><strong>Bei Unsicherheit:</strong> lieber knapp und konkret antworten als gar nichts hinschreiben – Teilpunkte gibt es oft auch für unvollständige, aber richtige Ansätze.</li>
    </ol>
  </div>`;
  html += renderAccordionSection('strategie', 'Wenn du bei einer Aufgabe nicht weiterweisst', 'var(--b)', body6);

  app.innerHTML = html;
}

function renderAccordionSection(id, title, colorVar, bodyHtml){
  const isOpen = tipOpenSection === id;
  return `<div class="accordion-item">
    <button class="accordion-header" onclick="toggleTipSection('${id}')">
      <span class="accordion-title"><span class="dot" style="background:${colorVar}"></span>${title}</span>
      <span class="accordion-chevron ${isOpen?'open':''}">▾</span>
    </button>
    <div class="accordion-body" style="display:${isOpen?'block':'none'};">${bodyHtml}</div>
  </div>`;
}

window.toggleTipSection = function(id){
  tipOpenSection = (tipOpenSection === id) ? null : id;
  renderTips();
};

function renderMatrix(){
  let html = `<button class="backbtn" onclick="goOverview()">← Übersicht</button>`;
  html += `<h2 class="topic-title">Kompetenz-Ebenen-Matrix</h2>`;
  html += `<div class="explain-card">
    <p>Diese Tabelle zeigt für jede der 19 Kompetenzen aus der IPA-Übersicht, welche der 6 Denkebenen (siehe "Lerntipps") in dieser Version des Lernmoduls bereits mit mindestens einer Aufgabe abgedeckt ist. Sie berechnet sich automatisch aus den vorhandenen Übungen – sobald neue Aufgaben mit einer Ebene ergänzt werden, aktualisiert sich diese Übersicht von selbst.</p>
  </div>`;

  const levelCols = LEVELS; // 6 Ebenen, in fester Reihenfolge

  html += `<div class="matrix-legend">
    <span><span class="cell-ok">✓</span> mindestens eine Aufgabe auf dieser Ebene vorhanden</span>
    <span><span class="cell-gap">–</span> noch keine Aufgabe auf dieser Ebene → hier zuerst neue Übungen ergänzen</span>
  </div>`;
  html += `<p class="comp-note" style="margin-top:-4px;">Achtung, Unterschied: "Aufgaben total" zählt alle Übungen einer Kompetenz. Die Häkchen zählen, wie viele <em>verschiedene</em> Denkebenen abgedeckt sind – zwei Übungen können zufällig dieselbe Ebene haben. Deshalb kann "Aufgaben total" höher sein als die Anzahl Häkchen in dieser Zeile.</p>`;

  html += `<div class="matrix-scroll"><table class="matrix-table"><thead><tr>
    <th class="rowhead">Kompetenz</th>
    ${levelCols.map(l=>`<th>${l.n}<br>${l.title}</th>`).join('')}
    <th>Aufgaben<br>total</th>
  </tr></thead><tbody>`;

  // Spalten-Zähler für die Gesamtzeile
  const colCovered = levelCols.map(()=>0);
  let totalRows = 0;

  IPA_COMPETENCIES.forEach(group=>{
    html += `<tr class="matrix-hkb-row"><td colspan="${levelCols.length+2}">Handlungskompetenzbereich ${group.hkb}</td></tr>`;
    group.items.forEach(item=>{
      const topic = getTopic(item.topicId);
      const levelsPresent = new Set((topic ? topic.questions : []).map(q=>q.level).filter(Boolean));
      totalRows++;
      html += `<tr>
        <td class="rowhead"><span class="matrix-code">${item.code}</span> <span class="matrix-label">${item.label}</span></td>
        ${levelCols.map((l,i)=>{
          const ok = levelsPresent.has(l.n);
          if(ok) colCovered[i]++;
          return `<td>${ok?'<span class="cell-ok">✓</span>':'<span class="cell-gap">–</span>'}</td>`;
        }).join('')}
        <td>${topic ? topic.questions.length : 0}</td>
      </tr>`;
    });
  });

  html += `<tr class="matrix-total-row">
    <td class="rowhead">Abgedeckt von ${totalRows} Kompetenzen</td>
    ${colCovered.map(c=>`<td>${c}/${totalRows}</td>`).join('')}
    <td></td>
  </tr>`;

  html += `</tbody></table></div>`;

  html += renderTransversalTable();

  html += renderFocusRecommendation();

  html += `<p class="comp-note">Tipp: Spalten mit niedrigen Werten in der letzten Zeile zeigen, welche Denkebene insgesamt noch zu wenig geübt wird.</p>`;

  app.innerHTML = html;
}

function renderTransversalTable(){
  const levelCols = LEVELS;
  let html = `<div class="section-title" style="margin-top:36px;"><span class="dot" style="background:var(--teal)"></span>Querschnittskompetenzen</div>
  <p class="section-desc">2.6, 4.1–4.3, 5.2 und 6.1 kommen in fast jeder Prüfungssituation vor (v. a. schriftlich), werden aber nie für die IPA ausgewählt. Deshalb separat von der Tabelle oben.</p>
  <div class="matrix-scroll"><table class="matrix-table"><thead><tr>
    <th class="rowhead">Kompetenz</th>
    ${levelCols.map(l=>`<th>${l.n}<br>${l.title}</th>`).join('')}
    <th>Aufgaben<br>total</th>
  </tr></thead><tbody>`;
  const colCovered = levelCols.map(()=>0);
  TRANSVERSAL_COMPETENCIES.forEach(item=>{
    const topic = getTopic(item.topicId);
    const levelsPresent = new Set((topic ? topic.questions : []).map(q=>q.level).filter(Boolean));
    html += `<tr>
      <td class="rowhead"><span class="matrix-code">${item.code}</span> <span class="matrix-label">${item.label}</span></td>
      ${levelCols.map((l,i)=>{
        const ok = levelsPresent.has(l.n);
        if(ok) colCovered[i]++;
        return `<td>${ok?'<span class="cell-ok">✓</span>':'<span class="cell-gap">–</span>'}</td>`;
      }).join('')}
      <td>${topic ? topic.questions.length : 0}</td>
    </tr>`;
  });
  html += `<tr class="matrix-total-row">
    <td class="rowhead">Abgedeckt von ${TRANSVERSAL_COMPETENCIES.length}</td>
    ${colCovered.map(c=>`<td>${c}/${TRANSVERSAL_COMPETENCIES.length}</td>`).join('')}
    <td></td>
  </tr>`;
  html += `</tbody></table></div>`;
  return html;
}

function renderFocusRecommendation(){
  const priorityRank = {A:0, B:1, IPA:2};
  const levelGaps = LEVELS.map(l=>{
    const missing = [];
    IPA_COMPETENCIES.forEach(group=>{
      group.items.forEach(item=>{
        const topic = getTopic(item.topicId);
        if(!topic) return;
        const has = topic.questions.some(q=>q.level===l.n);
        if(!has) missing.push({code:item.code, priority:topic.priority});
      });
    });
    missing.sort((a,b)=>(priorityRank[a.priority]??3)-(priorityRank[b.priority]??3));
    return {level:l, missing};
  }).filter(lg=>lg.missing.length>0)
    .sort((a,b)=> b.missing.length - a.missing.length);

  if(levelGaps.length===0){
    return `<div class="section-title" style="margin-top:32px;"><span class="dot" style="background:var(--good)"></span>Wo als Nächstes ansetzen</div>
    <div class="explain-card"><p>Alle 19 Kompetenzen sind inzwischen auf allen 6 Ebenen mindestens einmal abgedeckt. Weitere Aufgaben lohnen sich vor allem dort, wo insgesamt noch wenige Übungen vorhanden sind (siehe Spalte "Aufgaben total").</p></div>`;
  }

  let html = `<div class="section-title" style="margin-top:32px;"><span class="dot" style="background:var(--gentle)"></span>Wo als Nächstes ansetzen</div>
  <div class="explain-card">
    <p>Automatisch berechnet aus der Tabelle oben – die Ebenen mit den meisten Lücken zuerst, und innerhalb jeder Ebene zuerst die A-Themen (am prüfungsrelevantesten):</p>
    <ul>`;
  levelGaps.slice(0,4).forEach(lg=>{
    const topPicks = lg.missing.slice(0,5).map(m=>`${m.code}${m.priority!=='IPA'?' ('+m.priority+')':''}`).join(', ');
    html += `<li><strong>${lg.level.n}. ${lg.level.title}</strong> — fehlt bei ${lg.missing.length} von 19 Kompetenzen, am dringendsten: ${topPicks}${lg.missing.length>5?' …':''}</li>`;
  });
  html += `</ul></div>`;
  return html;
}

window.openMatrix = function(){
  state.view = 'matrix';
  renderMatrix();
  window.scrollTo({top:0, behavior:'smooth'});
};

window.openTips = function(){
  state.view = 'tips';
  renderTips();
  window.scrollTo({top:0, behavior:'smooth'});
};

window.goOverview = function(){
  state.view='overview';
  state.topicId=null;
  renderOverview();
  window.scrollTo({top:0, behavior:'smooth'});
};

renderOverview();
</script>
